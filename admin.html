
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIKA Admin Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8f7f4;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: min(90%, 400px);
            padding: 35px;
            background: white;
            border: 1px solid #eee;
        }

        h1 {
            text-align: center;
            letter-spacing: 3px;
        }

        p {
            text-align: center;
            color: #777;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <main class="login-box">
        <h1>RIKA.</h1>
        <p>Admin Dashboard Login</p>

        <form id="login-form">
            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
