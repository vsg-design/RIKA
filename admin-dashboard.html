
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIKA | Manage Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #f8f7f4;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        h1 {
            letter-spacing: 3px;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ddd;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .product img {
            width: 75px;
            height: 75px;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
        }

        .product-info p {
            color: #777;
            margin: 5px 0;
        }

        .delete-button {
            background: #a83232;
        }

        #message {
            color: #777;
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <h1>RIKA. <small>ADMIN</small></h1>
            <button id="logout-button">Logout</button>
        </header>

        <section class="panel">
            <h2>Add a product</h2>

            <form id="product-form">
                <input type="text" id="name"
                    placeholder="Product name" required>

                <input type="number" id="price"
                    placeholder="Price in ₹" min="0.01"
                    step="0.01" required>

                <div>
    <label for="category">Product Category</label>
    <select id="category" required>
        <option value="">Choose a category</option>
    </select>
</div>

<div>
    <label for="new-category">Or add a new category</label>
    <input
        type="text"
        id="new-category"
        placeholder="Example: Bangles"
    >
    <button type="button" id="add-category-btn">
        Add Category
    </button>
    <p id="category-message"></p>
</div>

                <textarea id="description"
                    placeholder="Product description"></textarea>

                <label for="image">Product photo</label>
                <input type="file" id="image"
                    accept="image/*" required>

                <button type="submit">Save Product</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="panel">
            <h2>Manage products</h2>
            <div id="product-list">Loading products...</div>
        </section>

    </main>

    <script type="module" src="admin-dashboard.js"></script>

</body>
</html>
